<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Admin – Renascer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<header>
  <img src="logo-renascer.svg" alt="Renascer" />
  <h1>Fluxo de Caixa</h1>
</header>

<main>

  <!-- ABA VENDA -->
  <div id="venda" class="card">
    <h2>Registrar Venda</h2>

    <label>Pessoa</label>
    <input id="cliente" placeholder="Nome da pessoa" />

    <label>Itens da venda</label>
    <div id="itens"></div>
    <button type="button" onclick="adicionarItem()" class="btn-secondary" style="margin-bottom:14px">
      + Adicionar produto
    </button>

    <div class="row">
      <div>
        <label>Caixa</label>
        <select id="caixaVenda">
          <option value="">Selecione</option>
          <option>Lanchonete</option>
        </select>
      </div>
      <div>
        <label>Total (R$)</label>
        <input id="total" disabled />
      </div>
    </div>

    <label>Pagamento</label>
    <div class="payments">
      <div class="pay active" onclick="pagar(this)">Dinheiro</div>
      <div class="pay" onclick="pagar(this)">PIX</div>
      <div class="pay" onclick="pagar(this)">Cartão</div>
    </div>

    <button onclick="registrarVenda()">Registrar Venda</button>
  </div>

  <!-- ABA PRODUTO -->
  <div id="produto" class="card" style="display:none">
    <h2 id="tituloProduto">Cadastrar Produto</h2>

    <div id="listaProdutos" style="margin-bottom:16px"></div>

    <label>Nome do produto</label>
    <input id="produtoNome" />

    <label>Preço (R$)</label>
    <input id="preco" type="number" step="0.01" min="0" />

    <label>Caixa</label>
    <select id="caixaProduto">
      <option>Lanchonete</option>
      <option>Lojinha</option>
    </select>

    <div style="display:flex; gap:10px">
      <button id="btnCancelarEdicao" type="button" onclick="cancelarEdicao()" class="btn-secondary" style="display:none; flex:1">Cancelar</button>
      <button id="btnSalvarProduto" onclick="salvarProduto()" style="flex:2">Salvar Produto</button>
    </div>
  </div>

  <!-- ABA PEDIDOS -->
  <div id="pedidos" class="card" style="display:none">
    <h2>Pedidos Pendentes</h2>
    <div id="listaPedidos"></div>
  </div>

  <!-- ABA DASHBOARD -->
  <div id="dashboard" style="display:none">
    <div class="dash-stats">
      <div class="stat-card stat-green">
        <div class="stat-label">Total Arrecadado</div>
        <div class="stat-value" id="dashTotal">—</div>
      </div>
      <div class="stat-card stat-red">
        <div class="stat-label">A Receber</div>
        <div class="stat-value" id="dashPendente">—</div>
      </div>
    </div>

    <div class="card">
      <h2>Produtos Mais Vendidos</h2>
      <div id="dashProdutos"><p style="color:var(--muted)">Carregando...</p></div>
    </div>

    <div class="card">
      <h2>Pendentes de Pagamento</h2>
      <div id="dashPendentes"><p style="color:var(--muted)">Carregando...</p></div>
    </div>
  </div>
</main>

<footer>Sistema de Caixa – Renascer</footer>

<nav class="bottom-nav">
  <div class="tab active" onclick="mostrar('venda', this)">
    <span class="nav-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1-2-1Z"/><path d="M14 8H8"/><path d="M16 12H8"/><path d="M13 16H8"/></svg></span>
    <span>Venda</span>
  </div>
  <div class="tab" onclick="mostrar('produto', this)">
    <span class="nav-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7.5 4.27 9 5.15"/><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg></span>
    <span>Produto</span>
  </div>
  <div class="tab" onclick="mostrar('pedidos', this)">
    <span class="nav-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" x2="21" y1="6" y2="6"/><line x1="8" x2="21" y1="12" y2="12"/><line x1="8" x2="21" y1="18" y2="18"/><line x1="3" x2="3.01" y1="6" y2="6"/><line x1="3" x2="3.01" y1="12" y2="12"/><line x1="3" x2="3.01" y1="18" y2="18"/></svg></span>
    <span>Pedidos</span>
  </div>
  <div class="tab" onclick="mostrar('dashboard', this)">
    <span class="nav-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg></span>
    <span>Dashboard</span>
  </div>
</nav>

<script src="admin.js"></script>
</body>
</html>
