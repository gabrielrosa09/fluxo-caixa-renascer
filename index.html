<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Admin – Renascer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<header>
  <img src="logo-renascer.png" alt="Renascer" />
  <h1>Fluxo de Caixa</h1>
</header>

<main>
  <div class="tabs">
    <div class="tab active" onclick="mostrar('venda', this)">🧾 Venda</div>
    <div class="tab" onclick="mostrar('produto', this)">📦 Produto</div>
    <div class="tab" onclick="mostrar('pedidos', this)">📋 Pedidos</div>
  </div>

  <!-- ABA VENDA -->
  <div id="venda" class="card">
    <h2>Registrar Venda</h2>

    <label>Pessoa</label>
    <input id="cliente" placeholder="Nome da pessoa" />

    <label>Itens da venda</label>
    <div id="itens"></div>
    <button type="button" onclick="adicionarItem()" class="btn-secondary" style="margin-bottom:14px">
      + Adicionar produto
    </button>

    <div class="row">
      <div>
        <label>Caixa</label>
        <select id="caixaVenda">
          <option value="">Selecione</option>
          <option>Lanchonete</option>
        </select>
      </div>
      <div>
        <label>Total (R$)</label>
        <input id="total" disabled />
      </div>
    </div>

    <label>Pagamento</label>
    <div class="payments">
      <div class="pay active" onclick="pagar(this)">Dinheiro</div>
      <div class="pay" onclick="pagar(this)">PIX</div>
      <div class="pay" onclick="pagar(this)">Cartão</div>
    </div>

    <button onclick="registrarVenda()">Registrar Venda</button>
  </div>

  <!-- ABA PRODUTO -->
  <div id="produto" class="card" style="display:none">
    <h2>Cadastrar Produto</h2>

    <label>Nome do produto</label>
    <input id="produtoNome" />

    <label>Preço (R$)</label>
    <input id="preco" type="number" step="0.01" min="0" />

    <label>Caixa</label>
    <select id="caixaProduto">
      <option>Lanchonete</option>
      <option>Lojinha</option>
    </select>

    <button onclick="salvarProduto()">Salvar Produto</button>
  </div>

  <!-- ABA PEDIDOS -->
  <div id="pedidos" class="card" style="display:none">
    <h2>Pedidos Pendentes</h2>
    <div id="listaPedidos"></div>
  </div>
</main>

<footer>Sistema de Caixa – Renascer 🙏</footer>

<script src="admin.js"></script>
</body>
</html>
